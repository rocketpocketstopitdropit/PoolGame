name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run engine tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee gradle.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a gradle.log

      # Turn compiler errors and failed tests into annotations, so they show on the run's summary page.
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|Exception|expected:" gradle.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -oE '<failure message="[^"]{0,300}' "$f" | head -10 | sed 's/^/::error::/'
          done
          true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pool-debug-apk
          path: app/build/outputs/apk/debug/*.apk
