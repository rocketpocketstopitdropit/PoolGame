name: Web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The web version is compiled from the same game-engine code as the Android app.
      - name: Get the Kotlin compiler
        run: |
          curl -sSL -o "$RUNNER_TEMP/kc.zip" https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip
          unzip -q "$RUNNER_TEMP/kc.zip" -d "$RUNNER_TEMP"

      - name: Build the web version
        run: KOTLIN_HOME="$RUNNER_TEMP/kotlinc" bash web/build.sh

      # Publish the built site to the gh-pages branch, which GitHub Pages serves.
      - name: Publish to gh-pages
        run: |
          cd web/build/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
